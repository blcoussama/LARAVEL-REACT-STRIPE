name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, tests et audit des dépendances
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Dépendances PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Dépendances JavaScript
        run: npm ci

      - name: Build des assets (Vite)
        run: npm run build

      - name: Fichier d'environnement de CI (aucun secret, Stripe non configuré)
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Migrations et seeder sur SQLite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/ci.sqlite
        run: |
          touch "$DB_DATABASE"
          php artisan migrate --seed --force --no-interaction

      - name: Tests (Pest)
        run: php artisan test

      - name: Audit des dépendances PHP
        run: composer audit

      - name: Audit des dépendances JavaScript
        run: npm audit
